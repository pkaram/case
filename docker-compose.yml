version: '3.8'

services:
  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:v1.17.0
    ports:
      - "6333:6333"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/qdrant:/qdrant/storage

  embeddings_gen:
    container_name: embeddings_gen
    build:
      context: ./embeddings-generator
    ports:
      - "8080:80"

  search:
    container_name: search_text
    build:
      context: ./search
    ports:
      - "${SEARCH_PORT:-5001}:5000"

networks:
  default:
    name: qdrant
